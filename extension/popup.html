<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 15px; font-family: sans-serif; }
    input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
    button { 
        width: 100%; 
        padding: 10px; 
        background-color: #FF9900; /* Amazon Orange */
        color: white; 
        border: none; 
        cursor: pointer; 
        font-weight: bold;
    }
    button:hover { background-color: #e68a00; }
  </style>
</head>
<body>

  <h3>Search Amazon</h3>
  
  <input type="text" id="search-input" placeholder="What are you looking for?">
  
  <button id="amazon-search-btn">Show on Amazon</button>

  <script src="popup.js"></script>
</body>
</html>
